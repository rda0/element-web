variables:
  GIT_STRATEGY: clone
  GIT_DEPTH: "3"

.tag:
  only:
    - /^dphys-.*$/
  except:
    - branches

.install_linux:
  extends: .tag
  stage: .pre
  script:
    - rm -rf ${HOME}/.cache
    - rm -rf ${HOME}/.local
    - rm -rf ${HOME}/.cargo
    - rm -rf ${HOME}/.npm
    - rm -rf ${HOME}/.rustup
    - rm -rf ${HOME}/.electron-gyp
    - curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- --no-modify-path --quiet -y

.build_linux:
  extends: .tag
  stage: build
  parallel:
    matrix:
      - SQLCIPHER_STATIC: ['1']
  script:
    - nodeenv --node=24.14.0 --prebuilt env
    - source env/bin/activate
    - npm install -g --no-package-lock --no-save yarn
    - corepack enable
    - corepack prepare "pnpm@$(node -p "require('./package.json').devEngines.packageManager.version.split('+')[0]")" --activate
    - pnpm --version
    - source ${HOME}/.cargo/env
    - export YARN_CACHE_FOLDER=env/cache
    - cd apps/desktop
    - pnpm install
    - mkdir -p element.phys.ethz.ch
    - rm -f element.phys.ethz.ch/config.json
    - wget https://element.phys.ethz.ch/config.json -O element.phys.ethz.ch/config.json
    - pnpm run fetch --noverify --cfgdir 'element.phys.ethz.ch'
    - mv webapp.asar webapp.orig.asar
    - npx asar extract webapp.orig.asar ./webapp.unpacked
    - cp -a ../../apps/web/res/media/message.* webapp.unpacked/media/
    - npx asar pack ./webapp.unpacked webapp.asar
    # Iteration ID will be used as deb revision by electron-builder (fpm)
    - unset CI_PIPELINE_IID
    - pnpm build --publish never
    - mkdir -p "/home/gitlab-runner/packages/${CI_PROJECT_NAME}${SQLCIPHER_STATIC/1/-static}/${CI_COMMIT_REF_NAME##*dphys-}"
    - cp dist/*.deb "/home/gitlab-runner/packages/${CI_PROJECT_NAME}${SQLCIPHER_STATIC/1/-static}/${CI_COMMIT_REF_NAME##*dphys-}"
    - cp dist/*.tar.gz "/home/gitlab-runner/packages/${CI_PROJECT_NAME}${SQLCIPHER_STATIC/1/-static}/${CI_COMMIT_REF_NAME##*dphys-}"

.build_windows:
  extends: .tag
  stage: build
  script:
    - docker run -v .:c:\scratch element_build_tools powershell -noprofile -command {
          cd c:\scratch ;

          choco install -y nodejs-lts;

          $env:path = "$($env:path);C:\Program Files\nodejs\;$($env:APPDATA)\npm";

          npm install --global yarn ;
          corepack enable ;
          $pnpmVersion = node -p "require('./package.json').devEngines.packageManager.version.split('+')[0]" ;
          corepack prepare "pnpm@$pnpmVersion" --activate ;
          pnpm --version ;

          rustup default stable ;
          rustup target add x86_64-pc-windows-msvc ;

          cd apps\desktop ;
          pnpm install --frozen-lockfile --filter element-desktop;

          mkdir element.phys.ethz.ch ;
          curl.exe https://element.phys.ethz.ch/config.json -o element.phys.ethz.ch/config.json ;
          pnpm run fetch --noverify --cfgdir element.phys.ethz.ch ;
          mv webapp.asar webapp.orig.asar ;
          npx asar extract webapp.orig.asar ./webapp.unpacked ;
          cp ..\..\apps\web\res\media\message.* webapp.unpacked\media\ ;
          npx asar pack ./webapp.unpacked webapp.asar ;

          pnpm run build --publish never -w squirrel;
          pnpm run build --publish never -w msi;
        }
    - $depRoot = 'C:\scratch\deployment_root\element-desktop\'
    - if( -not ( Test-Path $depRoot )){ mkdir $depRoot }
    - $outFile = "$depRoot\Element_$($CI_COMMIT_REF_NAME -replace '.*dphys-','').zip"
    - if(( Test-Path $outFile)){ remove-item -force $outFile }
    - Compress-Archive .\apps\desktop\dist\win-unpacked\* $outFile
    - cp .\apps\desktop\dist\Element*.msi $depRoot
    - cp .\apps\desktop\dist\squirrel-windows\Element*.exe $depRoot
    - cp .\apps\desktop\dist\squirrel-windows\element-desktop-*-full.nupkg $depRoot
    - cp .\apps\desktop\dist\squirrel-windows\RELEASES $depRoot

install-trixie:
  extends: .install_linux
  variables:
    DIST_CODENAME: "trixie"
  tags:
    - trixie

build-trixie:
  extends: .build_linux
  variables:
    DIST_CODENAME: "trixie"
  tags:
    - trixie

build-windows:
  extends: .build_windows
  tags:
    - windows
